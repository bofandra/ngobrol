name: ngobrol
description: A playful collaborative systems thinking prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.2'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/topics/
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-NotoSansSymbols.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: CausalSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Arrows.ttf
